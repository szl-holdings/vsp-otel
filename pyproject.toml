# SPDX-License-Identifier: Apache-2.0
# vsp-otel — Verifiable Span Provenance via OpenTelemetry (Python operational layer)
# Doctrine v11 LOCKED — 749/14/163 · Λ = Conjecture 1

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsp-otel"
version = "0.1.2"
description = "Verifiable Span Provenance via OpenTelemetry — real OTLP/gRPC exporter + DSSE/Khipu span processor for the SZL mesh"
readme = "src/vsp_otel/README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
license = { text = "Apache-2.0" }
authors = [{ name = "SZL Holdings" }]
keywords = ["opentelemetry", "otlp", "dsse", "provenance", "khipu", "slsa"]

dependencies = [
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]

[project.optional-dependencies]
fastapi = ["opentelemetry-instrumentation-fastapi>=0.46b0"]
test = [
  "pytest>=8.0",
  "fastapi>=0.115",
  "httpx>=0.28",
  "cryptography>=44",
  "rfc8785==0.1.4",
  "grpcio>=1.60",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.urls]
Homepage = "https://github.com/szl-holdings/vsp-otel"
Source = "https://github.com/szl-holdings/vsp-otel"
Issues = "https://github.com/szl-holdings/vsp-otel/issues"
Changelog = "https://github.com/szl-holdings/vsp-otel/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.szl.release]
import_names = ["vsp_otel"] # wheel top-level import names; the release gate fails if the built wheel differs

version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
        exclude-patterns:
        - torch*
        - transformers
        - accelerate
        - vllm
        - unsloth*
        - openai
    cooldown:
      default-days: 3

  # Python (pip) dependencies
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/collector"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
        exclude-patterns:
        - torch*
        - transformers
        - accelerate
        - vllm
        - unsloth*
        - openai
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 3
    groups:
      docker-deps:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
        exclude-patterns:
        - torch*
        - transformers
        - accelerate
        - vllm
        - unsloth*
        - openai
    cooldown:
      default-days: 3

  # npm / Node dependencies. The root pnpm workspace owns runtime and stubs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 10
    groups:
      npm-deps:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
        exclude-patterns:
        - torch*
        - transformers
        - accelerate
        - vllm
        - unsloth*
        - openai
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3

# SPDX-License-Identifier: Apache-2.0
# vsp-otel — Python operational layer CI
# Doctrine v11 LOCKED — 749/14/163 · Λ = Conjecture 1
# ADDITIVE: this is a NEW workflow alongside the existing TS `ci.yml`; it does
# not modify or replace TS CI. Runs the Python vsp_otel test suite.
name: Python CI

on:
  pull_request:
    branches:
    - main
    paths:
    - collector/**
    - src/vsp_otel/**
    - tests/**
    - pyproject.toml
    - Dockerfile
    - .github/workflows/python-ci.yml
  push:
    branches:
    - main
    paths:
    - collector/**
    - src/vsp_otel/**
    - tests/**
    - pyproject.toml
    - Dockerfile
    - .github/workflows/python-ci.yml
  workflow_dispatch: null
  merge_group:
    types:
    - checks_requested
    branches:
    - main
permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }} — lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Byte-compile (syntax gate)
        run: python -m compileall -q src/vsp_otel
      - name: Run test suite (includes real in-process OTLP/gRPC round-trip)
        run: pytest -q

  docker-integration:
    name: Real OTel Collector container integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Integration vs. real otel-collector container
        env:
          VSP_OTEL_IT_DOCKER: "1"
        run: pytest -q tests/test_integration.py

  docker-build:
    name: Build minimal image (per-file COPY)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -f Dockerfile.python-lib -t vsp-otel:ci .
      - name: Run banner (import smoke)
        run: docker run --rm vsp-otel:ci
      # The deployable collector image (root Dockerfile, used by the Helm chart)
      # was never built in CI before.
      - name: Build collector image
        run: docker build -f Dockerfile -t vsp-otel-collector:ci .
      - name: Collector image smoke (liveness up, readiness fail-closed)
        run: |
          docker run -d --name vsp-collector -p 127.0.0.1:4318:4318 vsp-otel-collector:ci
          trap 'docker logs vsp-collector; docker rm -f vsp-collector >/dev/null' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4318/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4318/healthz
          # No signing key or downstream is configured, so readiness must refuse.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4318/readyz)" = 503

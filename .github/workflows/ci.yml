name: CI

# Series-A quality gate — Doctrine v6
# Typecheck and test the vsp-otel runtime package.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 9.15.9 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: '24.19.0'
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify optional fuzz execution boundaries
        run: node --test tests/test_optional_fuzz.mjs
      - name: Lint
        run: pnpm lint
      - name: Build and typecheck
        run: pnpm -C runtime build
      - name: Test
        run: pnpm -C runtime test
      - name: Test root gate modules (src/pipeline, src/redaction, src/sla)
        run: pnpm run test:gates
      - name: Test bounded exporter properties and HTTP rejection
        run: pnpm run test:fuzz

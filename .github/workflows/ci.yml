name: CI

# Series-A quality gate — Doctrine v6
# Typecheck and test the vsp-otel runtime package.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9.15.9 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24.19.0'
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build and typecheck
        run: pnpm -C runtime build
      - name: Test
        run: pnpm -C runtime test
